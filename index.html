<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif}
body{background:#f4f1e8;color:#333}
.header{background:#6b0f1a;color:white;display:flex;justify-content:space-between;align-items:center;padding:18px 30px}
.header .logo-emk{width:110px;height:110px;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center;border:4px solid #c9a227;overflow:hidden}
.header .logo-emk b{color:#6b0f1a;font-size:28px;line-height:1;text-align:center}
.header .logo-emk span{font-size:9px;display:block;color:#6b0f1a}
.header h1{font-family:Montserrat;font-size:36px;letter-spacing:1px;text-align:center;line-height:1}
.badge-green{background:#15803d;color:white;padding:6px 18px;border-radius:20px;font-size:14px;font-weight:900;margin-top:8px;display:inline-block;letter-spacing:0.5px}
.escudo{width:90px}
.nav{background:#f8f6f0;display:flex;justify-content:space-between;align-items:center;padding:10px 20px;border-bottom:1px solid #ddd;flex-wrap:wrap}
.nav .links{display:flex;gap:12px;flex-wrap:wrap;font-weight:800;font-size:12px;color:#6b0f1a}
.nav .links a{color:#6b0f1a;text-decoration:none}
.reportar{background:#f3d078;color:#6b0f1a;padding:8px 18px;border-radius:8px;font-weight:900;font-size:13px;text-decoration:none;display:flex;align-items:center;gap:6px;border:2px solid #c9a227}
.banner{background:#6b0f1a;color:#f3d078;text-align:center;padding:16px;font-size:26px;font-weight:900;letter-spacing:0.5px;background-image: repeating-linear-gradient(110deg, transparent, transparent 20px, rgba(201,162,39,0.15) 20px, rgba(201,162,39,0.15) 22px)}
.main{max-width:1300px;margin:auto;display:grid;grid-template-columns:2.2fr 0.9fr;background:white}
@media(max-width:900px){.main{grid-template-columns:1fr}}
.left{padding:20px}
.right{padding:20px;background:#e8e2d5;text-align:center;border-left:4px solid #e5d5b0}
.titulo{color:#6b0f1a;font-weight:900;font-size:18px;border-left:5px solid #15803d;padding-left:10px;margin:20px 0 12px 0}
.video-box{background:#111;border-radius:14px;overflow:hidden;height:280px;display:flex;align-items:center;justify-content:center;position:relative;border:3px solid #222;color:#f3d078}
.video-box .play{width:55px;height:55px;background:#f3d078;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#111;font-size:22px;margin:auto}
.fb-card{border:2px solid #3b5998;border-radius:12px;padding:10px;margin-bottom:12px;display:flex;gap:10px;background:white}
.fb-card img{width:110px;height:70px;object-fit:cover;border-radius:6px}
.fb-card b{color:#3b5998;font-size:12px}
.fb-card p{font-size:12px;line-height:1.3}
.foto{width:140px;height:140px;border-radius:50%;border:5px solid white;object-fit:cover;box-shadow:0 4px 10px rgba(0,0,0,0.2)}
.video-msg{background:#1a1a1a;color:white;border-radius:12px;padding:18px;margin-top:12px}
.video-msg .play2{width:50px;height:50px;background:#f3d078;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#111;margin:0 auto 8px auto}
.atencion{background:#fef3c7;border:3px solid #f3d078;border-radius:12px;padding:12px;margin-top:14px;font-size:13px;line-height:1.4}
.footer{background:#6b0f1a;color:#f3d078;text-align:center;padding:12px;font-size:12px;font-weight:700;letter-spacing:1px}
